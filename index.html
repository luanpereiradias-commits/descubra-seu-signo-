<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra o Seu Signo ✦</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #a855f7;
            --accent2: #ec4899;
            --glow: rgba(168, 85, 247, 0.45);
            --card-bg: rgba(124, 58, 237, 0.12);
            --border: rgba(167, 139, 250, 0.25);
            --tag-bg: rgba(167, 139, 250, 0.15);
            --tag-color: #e9d5ff;
            --title-gradient: linear-gradient(90deg, #e9d5ff, #fbcfe8);
        }

        body {
            min-height: 100vh;
            font-family: 'Outfit', system-ui, sans-serif;
            background: #0a0a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            transition: background 0.6s ease;
        }

        /* Estrelas */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: var(--opacity); transform: scale(1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: rgba(20, 20, 45, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 42px 36px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header .icon {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #f5d0fe, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #a5b4fc;
            margin-bottom: 10px;
            font-weight: 500;
        }

        input[type="date"] {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.05rem;
            font-family: 'Outfit', system-ui, sans-serif;
            outline: none;
            transition: all 0.3s ease;
            color-scheme: dark;
        }

        input[type="date"]:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px var(--glow);
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            background-size: 200% 200%;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Outfit', system-ui, sans-serif;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px var(--glow);
            background-position: 100% 0;
        }

        #resultado {
            margin-top: 32px;
            display: none;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .resultado-card {
            background: linear-gradient(160deg, var(--card-bg), rgba(0,0,0,0.15));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            animation: reveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: all 0.5s ease;
        }

        .emoji-grande {
            font-size: 4.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: pulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 14px var(--glow));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .signo-nome {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            font-weight: 600;
            background: var(--title-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .signo-periodo {
            color: #c4b5fd;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: color 0.4s;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: #e2e8f0;
        }

        .descricao {
            font-size: 0.95rem;
            line-height: 1.65;
            color: #cbd5e1;
            margin-bottom: 18px;
            text-align: left;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .tag {
            background: var(--tag-bg);
            color: var(--tag-color);
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-weight: 500;
            transition: all 0.3s;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Temas por elemento */
        body.fogo {
            --accent: #f97316;
            --accent2: #ef4444;
            --glow: rgba(249, 115, 22, 0.45);
            --card-bg: rgba(249, 115, 22, 0.12);
            --border: rgba(251, 146, 60, 0.35);
            --tag-bg: rgba(249, 115, 22, 0.18);
            --tag-color: #ffedd5;
            --title-gradient: linear-gradient(90deg, #fed7aa, #fecaca);
        }

        body.terra {
            --accent: #22c55e;
            --accent2: #84cc16;
            --glow: rgba(34, 197, 94, 0.4);
            --card-bg: rgba(34, 197, 94, 0.12);
            --border: rgba(74, 222, 128, 0.3);
            --tag-bg: rgba(34, 197, 94, 0.18);
            --tag-color: #dcfce7;
            --title-gradient: linear-gradient(90deg, #bbf7d0, #d9f99d);
        }

        body.ar {
            --accent: #0ea5e9;
            --accent2: #06b6d4;
            --glow: rgba(14, 165, 233, 0.4);
            --card-bg: rgba(14, 165, 233, 0.12);
            --border: rgba(56, 189, 248, 0.3);
            --tag-bg: rgba(14, 165, 233, 0.18);
            --tag-color: #e0f2fe;
            --title-gradient: linear-gradient(90deg, #bae6fd, #a5f3fc);
        }

        body.agua {
            --accent: #8b5cf6;
            --accent2: #6366f1;
            --glow: rgba(139, 92, 246, 0.45);
            --card-bg: rgba(139, 92, 246, 0.14);
            --border: rgba(167, 139, 250, 0.35);
            --tag-bg: rgba(139, 92, 246, 0.2);
            --tag-color: #ede9fe;
            --title-gradient: linear-gradient(90deg, #ddd6fe, #c7d2fe);
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            h1 { font-size: 1.6rem; }
            .emoji-grande { font-size: 3.5rem; }
            .signo-nome { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="icon">✨</div>
                <h1>Descubra o Seu Signo</h1>
                <p class="subtitle">As estrelas revelam quem você é</p>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento</label>
                <input type="date" id="dataNascimento">
            </div>

            <button onclick="descobrirSigno()">✦ Revelar Meu Signo</button>

            <div id="resultado">
                <div class="resultado-card">
                    <div class="emoji-grande" id="emoji"></div>
                    <div class="signo-nome" id="nomeSigno"></div>
                    <div class="signo-periodo" id="periodo"></div>

                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Elemento</div>
                            <div class="info-value" id="elemento"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Planeta</div>
                            <div class="info-value" id="planeta"></div>
                        </div>
                    </div>

                    <p class="descricao" id="descricao"></p>
                    <div class="tags" id="tags"></div>
                </div>
            </div>
        </div>
        <p class="footer">✦ Astrologia ocidental • Apenas para diversão ✦</p>
    </div>

    <script>
        // Estrelas
        (function () {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--opacity', Math.random() * 0.7 + 0.3);
                star.style.setProperty('--duration', (Math.random() * 4 + 3) + 's');
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        })();

        const signos = [
            {
                nome: "Capricórnio", emoji: "♑", inicio: [12, 22], fim: [1, 19],
                elemento: "Terra", planeta: "Saturno ♄", elementoKey: "terra",
                desc: "Disciplinado, ambicioso e extremamente responsável. Você tem uma determinação inabalável e valoriza a estabilidade, o trabalho duro e as conquistas a longo prazo. Sua paciência é sua maior força.",
                tags: ["Disciplinado", "Ambicioso", "Prático", "Responsável", "Persistente"]
            },
            {
                nome: "Aquário", emoji: "♒", inicio: [1, 20], fim: [2, 18],
                elemento: "Ar", planeta: "Urano ♅", elementoKey: "ar",
                desc: "Independente, visionário e humanitário. Você pensa de forma original e está sempre à frente do seu tempo. Valoriza a liberdade, a inovação e as causas coletivas. Sua mente é brilhante e única.",
                tags: ["Independente", "Inovador", "Humanitário", "Original", "Visionário"]
            },
            {
                nome: "Peixes", emoji: "♓", inicio: [2, 19], fim: [3, 20],
                elemento: "Água", planeta: "Netuno ♆", elementoKey: "agua",
                desc: "Sensível, intuitivo e profundamente compassivo. Você possui uma imaginação rica e um coração generoso. Consegue sentir as emoções dos outros com facilidade e tem uma conexão especial com o mundo espiritual.",
                tags: ["Sensível", "Intuitivo", "Compassivo", "Sonhador", "Empático"]
            },
            {
                nome: "Áries", emoji: "♈", inicio: [3, 21], fim: [4, 19],
                elemento: "Fogo", planeta: "Marte ♂", elementoKey: "fogo",
                desc: "Corajoso, energético e pioneiro. Você age com impulsividade e liderança natural. Adora desafios, não tem medo de começar algo novo e inspira os outros com sua determinação e vitalidade.",
                tags: ["Corajoso", "Energético", "Líder", "Impulsivo", "Pioneiro"]
            },
            {
                nome: "Touro", emoji: "♉", inicio: [4, 20], fim: [5, 20],
                elemento: "Terra", planeta: "Vênus ♀", elementoKey: "terra",
                desc: "Confiável, paciente e extremamente leal. Você valoriza o conforto, a segurança e os prazeres da vida. Tem um gosto refinado e uma determinação silenciosa que o leva longe. A estabilidade é essencial para você.",
                tags: ["Confiável", "Paciente", "Sensual", "Leal", "Prático"]
            },
            {
                nome: "Gêmeos", emoji: "♊", inicio: [5, 21], fim: [6, 20],
                elemento: "Ar", planeta: "Mercúrio ☿", elementoKey: "ar",
                desc: "Comunicativo, curioso e extremamente versátil. Sua mente é rápida e você adora aprender e compartilhar ideias. Tem o dom da palavra e se adapta com facilidade a qualquer situação ou ambiente.",
                tags: ["Comunicativo", "Curioso", "Versátil", "Inteligente", "Sociável"]
            },
            {
                nome: "Câncer", emoji: "♋", inicio: [6, 21], fim: [7, 22],
                elemento: "Água", planeta: "Lua ☽", elementoKey: "agua",
                desc: "Protetor, emocional e profundamente intuitivo. Você é leal à família e aos amigos e tem um lado carinhoso e acolhedor. Sua sensibilidade é uma força, e você cria laços emocionais fortes e duradouros.",
                tags: ["Protetor", "Emocional", "Intuitivo", "Carinhoso", "Leal"]
            },
            {
                nome: "Leão", emoji: "♌", inicio: [7, 23], fim: [8, 22],
                elemento: "Fogo", planeta: "Sol ☉", elementoKey: "fogo",
                desc: "Confiante, generoso e naturalmente carismático. Você brilha onde quer que esteja e tem um coração nobre. Gosta de ser apreciado e tem um talento especial para inspirar e liderar com generosidade.",
                tags: ["Confiante", "Generoso", "Carismático", "Criativo", "Nobre"]
            },
            {
                nome: "Virgem", emoji: "♍", inicio: [8, 23], fim: [9, 22],
                elemento: "Terra", planeta: "Mercúrio ☿", elementoKey: "terra",
                desc: "Analítico, perfeccionista e extremamente prestativo. Você presta atenção aos mínimos detalhes e busca a excelência em tudo o que faz. Sua mente prática e organizada é uma grande aliada no dia a dia.",
                tags: ["Analítico", "Perfeccionista", "Prestativo", "Organizado", "Preciso"]
            },
            {
                nome: "Libra", emoji: "♎", inicio: [9, 23], fim: [10, 22],
                elemento: "Ar", planeta: "Vênus ♀", elementoKey: "ar",
                desc: "Diplomático, justo e extremamente sociável. Você busca harmonia em todas as áreas da vida e tem um forte senso de justiça. Valoriza a beleza, os relacionamentos e o equilíbrio em todas as coisas.",
                tags: ["Diplomático", "Justo", "Sociável", "Charmoso", "Equilibrado"]
            },
            {
                nome: "Escorpião", emoji: "♏", inicio: [10, 23], fim: [11, 21],
                elemento: "Água", planeta: "Plutão ♇", elementoKey: "agua",
                desc: "Intenso, determinado e profundamente misterioso. Você tem uma força de vontade impressionante e uma intuição aguçada. Não tem medo de explorar as profundezas emocionais e transforma tudo o que toca.",
                tags: ["Intenso", "Determinado", "Misterioso", "Apaixonado", "Transformador"]
            },
            {
                nome: "Sagitário", emoji: "♐", inicio: [11, 22], fim: [12, 21],
                elemento: "Fogo", planeta: "Júpiter ♃", elementoKey: "fogo",
                desc: "Otimista, aventureiro e filosófico. Você ama a liberdade e está sempre em busca de novos horizontes. Sua mente aberta e seu espírito explorador inspiram todos ao seu redor a expandir os limites.",
                tags: ["Otimista", "Aventureiro", "Filosófico", "Livre", "Entusiasta"]
            }
        ];

        function descobrirSigno() {
            const dataInput = document.getElementById("dataNascimento").value;
            
            if (!dataInput) {
                alert("Por favor, selecione sua data de nascimento ✨");
                return;
            }

            const data = new Date(dataInput + "T12:00:00");
            const dia = data.getDate();
            const mes = data.getMonth() + 1;

            let signo = null;

            for (let s of signos) {
                const [mi, di] = s.inicio;
                const [mf, df] = s.fim;

                if (mi > mf) {
                    if ((mes === mi && dia >= di) || (mes === mf && dia <= df)) {
                        signo = s;
                        break;
                    }
                } else {
                    if ((mes === mi && dia >= di) || (mes === mf && dia <= df) || (mes > mi && mes < mf)) {
                        signo = s;
                        break;
                    }
                }
            }

            if (signo) {
                // Aplica o tema do elemento
                document.body.className = signo.elementoKey;

                document.getElementById("emoji").textContent = signo.emoji;
                document.getElementById("nomeSigno").textContent = signo.nome;
                document.getElementById("periodo").textContent = formatarPeriodo(signo);
                document.getElementById("elemento").textContent = signo.elemento + " " + getElementoEmoji(signo.elemento);
                document.getElementById("planeta").textContent = signo.planeta;
                document.getElementById("descricao").textContent = signo.desc;

                const tagsContainer = document.getElementById("tags");
                tagsContainer.innerHTML = "";
                signo.tags.forEach(tag => {
                    const span = document.createElement("span");
                    span.className = "tag";
                    span.textContent = tag;
                    tagsContainer.appendChild(span);
                });

                document.getElementById("resultado").style.display = "block";
            }
        }

        function getElementoEmoji(el) {
            const map = { "Fogo": "🜂", "Terra": "🜃", "Ar": "🜁", "Água": "🜄" };
            return map[el] || "";
        }

        function formatarPeriodo(signo) {
            const meses = ["", "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
                           "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
            return `${signo.inicio[1]} de ${meses[signo.inicio[0]]}  —  ${signo.fim[1]} de ${meses[signo.fim[0]]}`;
        }

        document.getElementById("dataNascimento").addEventListener("keypress", e => {
            if (e.key === "Enter") descobrirSigno();
        });
    </script>
</body>
</html>
